<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube爆款标题生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit','Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.container{width:min(680px,100%);text-align:center}
h1{font-size:2rem;margin-bottom:8px;background:linear-gradient(135deg,#58a6ff,#f778ba);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:#8b949e;margin-bottom:32px;font-size:0.95rem}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px;margin-bottom:24px;text-align:left}
.input-group{margin-bottom:20px}
label{display:block;color:#c9d1d9;font-size:0.85rem;margin-bottom:8px;font-weight:500}
input[type="text"],input[type="password"]{width:100%;padding:14px 16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:1rem;outline:none;transition:border-color 0.2s}
input:focus{border-color:#58a6ff}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#238636,#2ea043);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.hint{color:#8b949e;font-size:0.8rem;margin-top:8px}
.results{display:none}
.results.active{display:block}
.section{margin-bottom:24px}
.section h2{color:#c9d1d9;font-size:1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #30363d}
.titles-list,.topics-list{list-style:none}
.titles-list li{padding:12px 16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all 0.2s}
.titles-list li:hover{background:#1c2128;border-color:#58a6ff}
.titles-list li.copied{background:#238636}
.topics-list{display:flex;flex-wrap:wrap;gap:8px}
.topics-list li{padding:10px 16px;background:#0d1117;border:1px solid #30363d;border-radius:20px;font-size:0.9rem;cursor:pointer;transition:all 0.2s}
.topics-list li:hover{background:#1c2128;border-color:#f778ba}
.loading{display:none;text-align:center;padding:40px;color:#8b949e}
.loading.active{display:block}
.spinner{width:40px;height:40px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:#3d1f1f;border:1px solid #f85149;border-radius:8px;padding:16px;color:#f85149;text-align:left;display:none}
.error.active{display:block}
.f
