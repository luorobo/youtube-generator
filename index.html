<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube爆款标题生成器 - DeepSeek驱动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.container{width:min(680px,100%);text-align:center}
h1{font-size:2.2rem;margin-bottom:8px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;margin-bottom:30px}
.card{background:#161b22;border:1px solid #2a2a3a;border-radius:16px;padding:28px;text-align:left;width:100%}
.input-group{margin-bottom:20px}
label{display:block;color:#c0c0c0;font-size:0.9rem;margin-bottom:8px;font-weight:500}
input{width:100%;padding:14px 16px;background:#0a0a0f;border:1px solid #2a2a3a;border-radius:8px;color:#fff;font-size:1rem;outline:none}
input:focus{border-color:#667eea}
.hint{color:#666;font-size:0.8rem;margin-top:6px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error{background:#2a1a1a;border:1px solid #f00;border-radius:8px;padding:14px;color:#f66;text-align:left;display:none;margin-bottom:16px}
.loading{display:none;text-align:center;padding:40px}
.loading.active{display:block}
.spinner{width:40px;height:40px;border:3px solid #2a2a3a;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.results{display:none;text-align:left}
.results.active{display:block}
.section{margin-bottom:24px}
.section h2{color:#c0c0c0;font-size:1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2a2a3a}
.titles-list li,.topics-list li{padding:12px 16px;background:#0a0a0f;border:1px solid #2a2a3a;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all 0.2s}
.titles-list li:hover,.topics-list li:hover{background:#1a1a2a;border-color:#667eea}
.titles-list li.copied,.topics-list li.copied{background:#238636;border-color:#238636}
footer{color:#555;font-size:0.8rem;margin-top:40px}
</style>
</head>
<body>
<div class="container">
<h1>YouTube爆款标题生成器</h1>
<p class="subtitle">DeepSeek驱动 · 10条标题 + 5个选题</p >
<div class="card">
<div class="error" id="error"></div>
<div class="input-group">
<label>DeepSeek API Key</label>
<input type="password" id="apiKey" placeholder="sk-..."/>
<div class="hint">密钥仅在您的浏览器中使用，安全可靠</div>
</div>
<div class="input-group">
<label>视频主题</label>
<input type="text" id="topic" placeholder="例如：AI写作技巧、健身减脂"/>
</div>
<button class="btn" id="generateBtn" onclick="generate()">生成爆款标题与选题</button>
</div>
<div class="loading" id="loading">
<div class="spinner"></div>
<p>AI正在思考中...</p >
</div>
<div class="results" id="results">
<div class="section">
<h2>爆款标题</h2>
<ul class="titles-list" id="titlesList"></ul>
</div>
<div class="section">
<h2>选题建议</h2>
<ul class="topics-list" id="topicsList"></ul>
</div>
</div>
</div>
<footer>由DeepSeek驱动 · 为创作者而生</footer>
<script>
function extractJson(text){
if(!text)return null;
const start=text.indexOf('{');
if(start===-1)return null;
let depth=0,escaped=false,inStr=false;
for(let i=start;i<text.length;i++){
const ch=text[i];
if(escaped){escaped=false;continue;}
if(ch==='\\'){escaped=true;continue;}
if(!inStr&&ch=='"'){inStr=true;continue;}
if(inStr&&ch=='"'){inStr=false;continue;}
if(!inStr){
if(ch==='{')depth++;
else if(ch==='}'){depth--;if(depth===0)return text.substring(start,i+1);}
}
}
return null;
}
async function generate(){
const apiKey=document.getElementById('apiKey').value.trim();
const topic=document.getElementById('topic').value.trim();
if(!apiKey){showError('请输入API Key');return;}
if(!topic){showError('请输入视频主题');return;}
document.getElementById('error').style.display='none';
document.getElementById('loading').classList.add('active');
document.getElementById('results').classList.remove('active');
document.getElementById('generateBtn').disabled=true;
try{
const response=await fetch('https://api.deepseek.com/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:'你是YouTube内容策划专家。返回JSON格式：{"titles":["标题1",...],"topics":["选题1",...]}，titles10个，topics5个。'},{role:'user',content:'为"'+topic+'"生成10个YouTube爆款标题和5个选题建议。'}],max_tokens:4096})
});
if(!response.ok)throw new Error('API请求失败');
const data=await response.json();
const content=data.choices?.[0]?.message?.content;
if(!content)throw new Error('返回内容为空');
const json=extractJson(content);
if(!json)throw new Error('解析失败');
const parsed=JSON.parse(json);
displayResults(parsed.titles||[],parsed.topics||[]);
}catch(e){showError(e.message);}
finally{document.getElementById('loading').classList.remove('active');document.getElementById('generateBtn').disabled=false;}
}
function displayResults(titles,topics){
document.getElementById('titlesList').innerHTML='';
document.getElementById('topicsList').innerHTML='';
titles.forEach((t,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+t;li.onclick=function(){copy(this,t);};document.getElementById('titlesList').appendChild(li);});
topics.forEach(t=>{const li=document.createElement('li');li.textContent='📌 '+t;li.onclick=function(){copy(this,t);};document.getElementById('topicsList').appendChild(li);});
document.getElementById('results').classList.add('active');
}
function copy(el,text){
navigator.clipboard.writeText(text).then(()=>{el.classList.add('copied');const orig=el.textContent;el.textContent='已复制!';setTimeout(()=>{el.textContent=orig;el.classList.remove('copied');},1500);});
}
function showError(msg){document.getElementById('error').textContent=msg;document.getElementById('error').style.display='block';}
</script>
</body>
</html>
